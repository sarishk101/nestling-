<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nestling – Baby Tracker</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#5f59d6"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#eef0fb;--card:#fff;--ink:#23264a;--mut:#6c7094;--acc:#5f59d6;--sl:#5f59d6;--ap:#ff9f6e;--sg:#4cb58f;--line:#dfe2f4;--chip:#e8e9fb;--on:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14162e;--card:#1e2142;--ink:#eceeff;--mut:#9a9dc8;--acc:#9a94ff;--sl:#9a94ff;--line:#333764;--chip:#2a2e5a;--on:#14162e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14162e;--card:#1e2142;--ink:#eceeff;--mut:#9a9dc8;--acc:#9a94ff;--sl:#9a94ff;--line:#333764;--chip:#2a2e5a;--on:#14162e;color-scheme:dark}
:root[data-theme="night"]{--bg:#000;--card:#0a0605;--ink:#d9a86c;--mut:#8a6a45;--acc:#c0702a;--sl:#c0702a;--ap:#a85c2a;--sg:#6a8f5a;--line:#2b1a0e;--chip:#1a0f08;--on:#000;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:96px;min-height:100%}
button,input{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px}
h1,h2,.serif{font-family:Georgia,"Times New Roman",serif;font-weight:700;margin:0}
.top{display:flex;justify-content:space-between;align-items:center}
.top h1{font-size:26px;letter-spacing:-.5px}
.who{text-align:right;font-size:14px;color:var(--mut)}.who b{display:block;color:var(--ink);font-size:17px}
.dn{display:flex;gap:8px;margin:12px 0}
.dn button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 16px}
.dn .d{flex:1;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0}
.ring{position:relative;max-width:320px;margin:0 auto}
.ring svg{width:100%;display:block}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 22%}
.mid .big{font-family:Georgia,serif;font-size:26px;font-weight:700}
.mid small{color:var(--mut)}
.btn{border:0;background:var(--acc);color:var(--on);border-radius:999px;padding:11px 22px;font-weight:700;margin-top:8px}
.btn.o{background:none;border:2px solid var(--acc);color:var(--acc)}
.btn.ap{background:var(--ap);color:#23264a}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{border:1px solid var(--line);background:var(--bg);border-radius:18px;padding:10px 2px 8px;text-align:center;font-size:13px}
.tile span{display:block;font-size:28px;line-height:1.2}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}.row .i{font-size:24px}.row .t{flex:1}.row small{color:var(--mut);display:block}
.x{border:0;background:none;color:var(--mut);font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:7px 14px}
.chip.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
label{display:block;font-size:14px;color:var(--mut);margin-top:8px}
input{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;margin-top:4px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;padding:6px 0;font-size:12px;color:var(--mut)}
nav button span{display:block;font-size:22px}nav .on{color:var(--acc);font-weight:700}
#sh{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:9}
#sh.o{display:flex}
#sh>div{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.bars{display:flex;gap:8px;align-items:flex-end;height:120px;margin-top:8px}
.bars div{flex:1;text-align:center;font-size:12px;color:var(--mut)}
.bars i{display:block;background:var(--sl);border-radius:8px 8px 3px 3px;margin-bottom:4px}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px}.st div{background:var(--bg);border-radius:16px;padding:12px}
.st b{font-family:Georgia,serif;font-size:22px;display:block}
.ck{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:11px 0;border-top:1px solid var(--line)}
.ck u{width:26px;height:26px;border:2px solid var(--acc);border-radius:9px;display:grid;place-items:center;text-decoration:none;flex:none}
.ck.on u{background:var(--acc);color:var(--on)}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;display:none;z-index:20}
@media (prefers-reduced-motion:no-preference){.ring circle.now{animation:p 2s infinite}@keyframes p{50%{opacity:.35}}}
</style></head><body>
<div class="wrap" id="app"></div>
<nav id="nav"></nav><div id="sh"><div id="shc"></div></div><div id="toast"></div>
<script>
const DAY=864e5,$=s=>document.querySelector(s);
const T={feed:['🍼','Bottle'],breast:['🤱','Breast'],nappy:['🧷','Nappy'],sleep:['🌙','Sleep'],wake:['⭐','Night wake'],pump:['🥛','Pump'],cry:['😢','Crying'],solid:['🥣','Solids'],med:['🌡️','Med / temp'],act:['🧸','Activity'],note:['📝','Note'],bath:['🛁','Bath'],care:['🧴','Care'],growth:['📏','Growth'],vax:['💉','Vaccine']};
const F={
feed:[{k:'ml',l:'Amount (ml)',t:'n',u:'ml'},{k:'what',l:'Milk',o:['Formula','Breast milk']}],
breast:[{k:'side',l:'Side',o:['Left','Right','Both']},{k:'min',l:'Minutes',t:'n',u:'min'}],
nappy:[{k:'kind',l:'Type',o:['Wet','Dirty','Both','Dry']},{k:'rash',l:'Skin',o:['Fine','Redness','Sore']}],
sleep:[{k:'kind',l:'Type',o:['Nap','Bedtime']}],wake:[{k:'min',l:'Minutes awake',t:'n',u:'min'},{k:'how',l:'Settled by',o:['Feed','Cuddle','Alone']}],
pump:[{k:'ml',l:'Amount (ml)',t:'n',u:'ml'},{k:'side',l:'Side',o:['Left','Right','Both']}],
cry:[{k:'min',l:'Minutes',t:'n',u:'min'},{k:'why',l:'Likely reason',o:['Hungry','Tired','Gas','Nappy','Unsure']}],
solid:[{k:'method',l:'Method',o:['Puree','Baby-led','Finger food']},{k:'food',l:'Food',o:['Avocado','Banana','Porridge','Sweet potato','Carrot','Egg','Yogurt','Peanut butter','Bread','Fish']},{k:'food2',l:'Other food',t:'s'},{k:'react',l:'Reaction',o:['Loved it','Okay','Refused','Rash or hives','Vomiting','Swelling or breathing trouble']}],
med:[{k:'temp',l:'Temperature (°C)',t:'n',u:'°C'},{k:'med',l:'Medicine and dose',t:'s'},{k:'gap',l:'Wait before next dose',o:['4h','6h','8h','12h']}],
act:[{k:'what',l:'Activity',o:['Tummy time','Play','Story','Walk','Music']},{k:'min',l:'Minutes',t:'n',u:'min'}],
note:[{k:'text',l:'Note',t:'s'}],
growth:[{k:'kg',l:'Weight (kg)',t:'n',u:'kg'},{k:'cm',l:'Length (cm)',t:'n',u:'cm'},{k:'head',l:'Head (cm)',t:'n',u:'cm head'}],vax:[{k:'name',l:'Vaccine',t:'s'},{k:'note',l:'Notes (batch, clinic)',t:'s'}]};
const CARE=['Nail trim','Gum or tooth clean','Hair brush','Ear clean','Skin check','Moisturise'];
let S={baby:{name:'',dob:''},ev:[],steps:['Check water is about 37 °C','Wash face and eyes','Wash neck, folds and body','Wash hair','Wrap in a warm towel','Pat skin folds dry','Moisturise','Nappy cream if needed']};
try{const o=JSON.parse(localStorage.getItem('nestling')||'{}');if(o.steps)S.steps=o.steps;S.night=o.night;S.gone=o.gone||[];S.babies=o.babies||(o.baby?[{id:1,name:o.baby.name,dob:o.baby.dob,ev:o.ev||[]}]:[]);S.cur=o.cur}catch(e){}
if(!S.babies||!S.babies.length)S.babies=[{id:1,name:'',dob:'',ev:[]}];
S.baby=S.babies.find(b=>b.id===S.cur)||S.babies[0];S.ev=S.baby.ev;
const save=()=>{try{localStorage.setItem('nestling',JSON.stringify({babies:S.babies,cur:S.baby.id,steps:S.steps,night:S.night,gone:S.gone}))}catch(e){}if(!quiet)pushSoon()};
const d0=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
let tab='track',day=d0(Date.now()),sh=null,chk=[],bv={};
const now=()=>Date.now(),ft=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const dur=m=>{m=Math.round(m);return m>=60?Math.floor(m/60)+'h '+(m%60)+'m':m+'m'};
const endOf=e=>e.type==='sleep'?(e.end||now()):e.t;
const evs=(a=day)=>S.ev.filter(e=>e.t<a+DAY&&endOf(e)>=a).sort((x,y)=>y.t-x.t);
const li=t=>{const d=new Date(t-new Date(t).getTimezoneOffset()*6e4);return d.toISOString().slice(0,16)};
const active=()=>S.ev.find(e=>e.type==='sleep'&&!e.end);
const last=(...ty)=>S.ev.filter(e=>ty.includes(e.type)).sort((a,b)=>b.t-a.t)[0];
const ageM=()=>S.baby.dob?(now()-new Date(S.baby.dob))/(30.44*DAY):null;
const ageS=()=>{const m=ageM();return m===null?'Add birthday':m<2?Math.floor(m*4.35)+' weeks':Math.floor(m)+' months'};
const wwin=()=>{const m=ageM()??6;return(m<3?60:m<6?105:m<9?150:m<12?180:210)*6e4};
const feedGap=()=>((ageM()??6)<4?3:3.5)*36e5;
const ago=t=>{const m=(now()-t)/6e4;return m<60?dur(m)+' ago':m<2880?Math.floor(m/60)+'h ago':Math.floor(m/1440)+' days ago'};
const sleepMin=a=>S.ev.filter(e=>e.type==='sleep').reduce((s,e)=>s+Math.max(0,Math.min(endOf(e),a+DAY)-Math.max(e.t,a)),0)/6e4;
function summ(e){
if(e.type==='sleep')return(e.d.kind?e.d.kind+' · ':'')+dur(((e.end||now())-e.t)/6e4)+(e.end?'':' so far');
if(e.type==='bath')return[e.d.steps&&e.d.steps+' steps',e.d.temp&&e.d.temp+' °C',e.d.mood].filter(Boolean).join(' · ');
if(e.type==='care')return e.d.what;
return(F[e.type]||[]).map(f=>e.d[f.k]!=null?e.d[f.k]+(f.u&&f.t==='n'?' '+f.u:''):'').filter(Boolean).join(' · ')}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
function add(type,t,d={},end){S.ev.push({id:now()+Math.random(),type,t,d,end});save();render()}
const startSleep=k=>add('sleep',now(),{kind:k||(isNight()?'Bedtime':'Nap')});
function wakeNow(){const a=active();if(a){a.end=now();save();render()}}
const del=id=>{const i=S.ev.findIndex(e=>e.id===id);if(i>=0)S.ev.splice(i,1);(S.gone=S.gone||[]).push(id);save();render()};
function ang(t){return(Math.min(Math.max(t,day),day+DAY)-day)/DAY*2*Math.PI-Math.PI/2}
function arc(a,b,r){const p=x=>[150+r*Math.cos(x),150+r*Math.sin(x)],[x1,y1]=p(a),[x2,y2]=p(b);return`M${x1.toFixed(1)} ${y1.toFixed(1)}A${r} ${r} 0 ${b-a>Math.PI?1:0} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`}
function clock(){
const E=evs(),isT=day===d0(now());let s='';
E.filter(e=>e.type==='sleep').forEach(e=>{const a=ang(e.t),b=ang(endOf(e));if(b-a>.02)s+=`<path d="${arc(a,b,118)}" fill="none" stroke="var(--sl)" stroke-width="22" stroke-linecap="round"/>`});
E.filter(e=>e.type!=='sleep'&&e.t>=day&&e.t<day+DAY).forEach(e=>{const a=ang(e.t);const c=['feed','breast','pump','solid'].includes(e.type)?'var(--ap)':e.type==='nappy'?'var(--sg)':'var(--mut)';s+=`<circle cx="${150+146*Math.cos(a)}" cy="${150+146*Math.sin(a)}" r="5" fill="${c}"/>`});
if(isT){const a=ang(now());s+=`<circle class="now" cx="${150+118*Math.cos(a)}" cy="${150+118*Math.sin(a)}" r="6" fill="var(--ink)"/>`}
const lb=[['12am',150,18],['6am',282,154],['12pm',150,292],['6pm',18,154]].map(([t,x,y])=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="11" fill="var(--mut)">${t}</text>`).join('');
let mid='<div class="big">'+new Date(day).toLocaleDateString([],{weekday:'long'})+'</div><small>Nothing logged yet</small>';
if(isT){const a=active(),l=last('sleep','wake');
if(a)mid=`<small>${a.d.kind||'Sleep'} in progress</small><div class="big">${dur((now()-a.t)/6e4)}</div><small>Since ${ft(a.t)}</small><button class="btn ap" onclick="wakeNow()">Wake now</button>`;
else{const w=l&&l.type==='sleep'?l.end:l?l.t:null;const nap=w?ft(w+wwin()):'';mid=`<small>Awake</small><div class="big">${w?dur((now()-w)/6e4):'–'}</div>${nap?`<small>Next nap about ${nap}</small>`:''}<div style="display:flex;gap:6px;justify-content:center;margin-top:8px"><button class="btn${isNight()?' o':''}" style="margin:0;padding:9px 14px" onclick="startSleep('Nap')">Nap</button><button class="btn${isNight()?'':' o'}" style="margin:0;padding:9px 14px" onclick="startSleep('Bedtime')">Bedtime</button></div>`}}
else{const m=sleepMin(day);mid=`<small>Slept</small><div class="big">${dur(m)}</div>`}
return`<div class="ring"><svg viewBox="0 0 300 300"><circle cx="150" cy="150" r="118" fill="none" stroke="var(--line)" stroke-width="22"/>${s}${lb}</svg><div class="mid">${mid}</div></div>`}
function nextFeed(){const l=last('feed','breast');return l?`Next feed around ${ft(l.t+feedGap())} <small>(last ${ago(l.t)})</small>`:'Log a feed to see the next feed estimate'}
function track(){
const tiles=['feed','breast','nappy','sleep','wake','pump','cry','solid','med','act','note','bath'].map(k=>`<button class="tile" onclick="${k==='bath'?"go('bath')":`openS('${k}')`}"><span>${T[k][0]}</span>${T[k][1]}</button>`).join('');
const list=evs().map(e=>`<div class="row"><div class="i">${T[e.type][0]}</div><div class="t">${T[e.type][1]}<small>${summ(e)}</small></div><small>${ft(e.t)}</small><button class="x" aria-label="Delete" onclick="del(${e.id})">×</button></div>`).join('')||'<small>Tap a tile above to log your first moment.</small>';
return`${S.baby.name?'':`<div class="card"><b>Welcome to Nestling.</b><br><small>Add your baby’s name and birthday to get age-based nap and feed estimates.</small><br><button class="btn" onclick="go('grow')">Set up baby</button></div>`}
<div class="card">${clock()}</div>${day===d0(now())?`<div class="card"><h2>Next up</h2>${smart().map(x=>`<p style="margin:8px 0">${x}</p>`).join('')}</div>`:''}
<div class="card"><h2 style="margin-bottom:10px">Log</h2><div class="grid">${tiles}</div></div>
${warn?'<div class="card" style="border-color:#d33"><b>Possible reaction logged</b><br><small>If there is swelling, trouble breathing, or baby is floppy or very unwell, call emergency services now. For milder signs, contact your doctor or health visitor before offering this food again.</small><br><button class="chip" onclick="warn=false;render()">Dismiss</button></div>':''}<div class="card"><h2>Soothing sounds</h2><div class="chips">${['White','Brown','Rain'].map(n=>`<button class="chip ${snd&&snd.n===n?'on':''}" onclick="sound('${n}')">${n}</button>`).join('')}${snd?'<button class="chip" onclick="sound()">Stop</button>':''}</div><small>Stops after 30 minutes. Keep the volume low and the phone a few metres from the cot.</small></div>
<div class="card"><h2>Timeline</h2>${list}</div>`}
function bath(){
const lb=last('bath'),a=ageM()??3;
const tip=a<1?'Newborns do well with sponge baths until the cord stump heals. Check with your midwife or nurse.':a<6?'Two to three baths a week is plenty. Keep it brief and warm.':'Bath time can be part of the bedtime routine. Never leave baby alone, even for a moment.';
const rows=S.steps.map((s,i)=>`<button class="ck ${chk.includes(i)?'on':''}" onclick="tg(${i})"><u>${chk.includes(i)?'✓':''}</u><span style="flex:1">${s}</span></button>`).join('');
const care=CARE.map(c=>{const l=S.ev.filter(e=>e.type==='care'&&e.d.what===c).sort((x,y)=>y.t-x.t)[0];return`<div class="row"><div class="t">${c}<small>${l?'Done '+ago(l.t):'Not logged yet'}</small></div><button class="btn o" style="margin:0;padding:7px 16px" onclick="add('care',now(),{what:'${c}'});toast('Logged')">Done</button></div>`}).join('');
return`<div class="card"><h2>Bath routine</h2><small>${lb?'Last bath '+ago(lb.t):'No baths logged yet'}</small><p>${tip}</p>${rows}
<label>Water temperature (°C)<input type="number" inputmode="decimal" value="${bv.temp||''}" oninput="bv.temp=this.value"></label>
<div class="chips">${['Loved it','Calm','Fussy'].map(m=>`<button class="chip ${bv.mood===m?'on':''}" onclick="bv.mood='${m}';render()">${m}</button>`).join('')}</div>
<button class="btn" onclick="logBath()">Log bath (${chk.length}/${S.steps.length})</button></div>
<div class="card"><h2>Add a step</h2><input id="ns" placeholder="For example: Rinse with cup"><button class="btn o" onclick="addStep()">Add step</button></div>
<div class="card"><h2>Head-to-toe care</h2>${care}</div>`}
const tg=i=>{chk=chk.includes(i)?chk.filter(x=>x!==i):[...chk,i];render()};
function logBath(){add('bath',now(),{steps:chk.length+'/'+S.steps.length,temp:bv.temp,mood:bv.mood});chk=[];bv={};toast('Bath logged')}
function addStep(){const v=$('#ns').value.trim();if(v){S.steps.push(v);save();render()}}
function stats(){
const E=evs(),c=ty=>E.filter(e=>ty.includes(e.type)),sm=(ty,k)=>c(ty).reduce((s,e)=>s+(+e.d[k]||0),0);
const wet=c(['nappy']).filter(e=>['Wet','Both'].includes(e.d.kind)).length,dirty=c(['nappy']).filter(e=>['Dirty','Both'].includes(e.d.kind)).length;
const days=[...Array(7)].map((_,i)=>day-(6-i)*DAY),mx=Math.max(16*60,...days.map(sleepMin));
const bars=days.map(a=>{const m=sleepMin(a);return`<div><i style="height:${Math.max(4,m/mx*90)}px"></i>${new Date(a).toLocaleDateString([],{weekday:'narrow'})}<br>${(m/60).toFixed(1)}</div>`}).join('');
return`<div class="card"><h2 style="margin-bottom:10px">${day===d0(now())?'Today':new Date(day).toLocaleDateString([],{weekday:'long'})}</h2><div class="st">
<div><b>${c(['feed','breast']).length}</b>feeds</div><div><b>${sm(['feed','pump'],'ml')} ml</b>bottle and pumped</div>
<div><b>${dur(sleepMin(day))}</b>sleep</div><div><b>${sm(['breast'],'min')} min</b>breastfeeding</div>
<div><b>${wet} / ${dirty}</b>wet / dirty nappies</div><div><b>${sm(['cry'],'min')} min</b>crying</div>
<div><b>${sm(['act'],'min')} min</b>play and tummy time</div><div><b>${c(['bath']).length}</b>baths</div></div>
<button class="btn" onclick="copyRep()">Copy day report</button></div>
<div class="card"><h2>Sleep, last 7 days (hours)</h2><div class="bars">${bars}</div></div>${foods()}<div class="card"><h2>Doctor visit summary</h2><small>Last 7 days of sleep, feeds, nappies, temperatures, medicines, foods and growth.</small><br><button class="btn" onclick="shr(rep7())">Share summary</button></div>`}
function copyRep(){const E=evs().reverse();const t=`${S.baby.name||'Baby'} – ${new Date(day).toLocaleDateString()}\n`+E.map(e=>`${ft(e.t)} ${T[e.type][1]} ${summ(e)}`).join('\n');
try{navigator.clipboard.writeText(t).then(()=>toast('Report copied'),()=>toast('Copy not available'))}catch(e){toast('Copy not available')}}
function grow(){
const g=S.ev.filter(e=>e.type==='growth').sort((a,b)=>b.t-a.t).map(e=>`<div class="row"><div class="t">${new Date(e.t).toLocaleDateString()}<small>${summ(e)}</small></div><button class="x" aria-label="Delete" onclick="del(${e.id})">×</button></div>`).join('')||'<small>No measurements yet.</small>';

$('#shc').innerHTML=`<h2>${T[k][0]} ${T[k][1]}</h2>${f}${tipFor()}<label>${k==='sleep'?'Fell asleep':'Time'}<input type="datetime-local" value="${sh.t}" oninput="sh.t=this.value"></label>${k==='sleep'?`<label>Woke up (leave empty if still asleep)<input type="datetime-local" value="${sh.end}" oninput="sh.end=this.value"></label>`:''}
<button class="btn" onclick="saveS()">Save</button> <button class="btn o" onclick="closeS()">Cancel</button>`;$('#sh').classList.add('o')}
const closeS=()=>{sh=null;$('#sh').classList.remove('o')};
function saveS(){const d={};for(const k in sh.v)if(sh.v[k]!=='')d[k]=sh.v[k];const t=new Date(sh.t).getTime();if(isNaN(t)){toast('Pick a valid time');return}
const end=sh.end?new Date(sh.end).getTime():undefined;const ty=sh.k;closeS();if(/Rash|Swelling|Vomiting/.test(d.react||''))warn=true;add(ty,t,d,end)}
$('#sh').addEventListener('click',e=>{if(e.target.id==='sh')closeS()});
function render(){if(S.night)document.documentElement.setAttribute('data-theme','night');else document.documentElement.removeAttribute('data-theme');
const tabs=[['track','🌙','Track'],['bath','🛁','Bath & care'],['stats','📊','Insights'],['mile','⭐','Milestones'],['grow','🌱','Baby']];
$('#nav').innerHTML=tabs.map(([k,i,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('');
const hdr=`<div class="top"><h1>Nestling</h1><button class="chip" onclick="S.night=!S.night;save();render()">${S.night?'☀️ Day':'🌙 Night'}</button><div class="who" ${S.babies.length>1?'onclick="nextBaby()" role="button" tabindex="0"':''}>${S.baby.photo?`<img alt="" src="${S.baby.photo}" style="width:44px;height:44px;border-radius:50%;object-fit:cover;float:right;margin-left:10px">`:''}<b>${S.baby.name||'Your baby'}${S.babies.length>1?' ⇅':''}</b>${ageS()}</div></div>
<div class="dn"><button aria-label="Previous day" onclick="day-=DAY;render()">‹</button><button class="d" onclick="day=d0(now());render()">${day===d0(now())?'Today, ':''}${new Date(day).toLocaleDateString([],{weekday:'short',day:'numeric',month:'short'})}</button><button aria-label="Next day" onclick="if(day<d0(now())){day+=DAY;render()}">›</button></div>`;
$('#app').innerHTML=(tab==='grow'||tab==='bath'||tab==='mile'?hdr.replace(/<div class="dn">[\s\S]*$/,''):hdr)+({track,bath,stats,grow,mile}[tab])();}
render();syncInit();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});setInterval(()=>{if(!sh&&tab==='track'&&!document.activeElement.matches('input'))render()},30000);
</script></body></html>
